<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Виды волн</title>
<style>
:root{
  --bg:#edf2f6;
  --panel:#ffffff;
  --panel-soft:#f5f8fa;
  --text:#243447;
  --muted:#46596b;
  --line:#cbd6df;
  --green:#00CC97;
  --green-dark:#009e76;
  --orange:#FF8633;
  --orange-dark:#d96719;
  --particle:#243447;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:Inter,"Segoe UI",Tahoma,sans-serif;
  color:var(--text);
  background:var(--bg);
  padding:7px 12px 25px;
  display:flex;
  flex-direction:column;
  gap:7px;
}
header{
  flex:0 0 auto;
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 2px 8px rgba(36,52,71,.05);
}
h1{
  font-size:clamp(22px,2.5vw,30px);
  font-weight:800;
  letter-spacing:.35px;
  background:linear-gradient(105deg,#00a879 0%,#00CC97 24%,#FF8633 48%,#00CC97 72%,#00a879 100%);
  background-size:250% auto;
  color:transparent;
  -webkit-background-clip:text;
  background-clip:text;
  animation:titleShimmer 6s linear infinite;
}
@keyframes titleShimmer{to{background-position:250% center}}
main{
  flex:1 1 auto;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.wave-card{
  min-width:0;
  min-height:0;
  display:grid;
  grid-template-rows:auto minmax(150px,1fr) auto auto;
  gap:10px;
  padding:13px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 3px 12px rgba(36,52,71,.06);
}
.card-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.card-heading h2{font-size:clamp(18px,1.8vw,21px);font-weight:500}
.wave-tag{
  font-size:14px;
  font-weight:500;
  color:var(--green-dark);
  background:rgba(0,204,151,.11);
  border:1px solid rgba(0,158,118,.25);
  border-radius:20px;
  padding:4px 9px;
  white-space:nowrap;
}
.canvas-wrap{
  min-height:0;
  position:relative;
  overflow:hidden;
  border:1px solid #bdcbd6;
  border-radius:9px;
  background:linear-gradient(180deg,#fbfdff,#f0f5f8);
}
canvas{display:block;width:100%;height:100%}
.signature{position:fixed;right:14px;bottom:5px;font-size:11px;letter-spacing:.25px;color:#46596b;font-weight:600;pointer-events:none;}
.canvas-caption{
  position:absolute;
  left:10px;top:8px;
  font-size:14px;
  color:#4d6072;
  background:rgba(255,255,255,.8);
  padding:3px 6px;
  border-radius:4px;
  pointer-events:none;
}
.speed-row{
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px 15px;
  padding:7px 10px;
  border-radius:8px;
  background:#f1f6f8;
  border:1px solid #dce5eb;
}
.speed-value{font-size:17px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.speed-value strong{font-weight:800;color:var(--text)}
.speed-value .speed-result{color:var(--orange-dark);}
.speed-value em{font-style:italic;color:var(--muted)}
.controls{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
  align-items:end;
}
.control{
  min-width:0;
  padding:8px 9px 7px;
  background:var(--panel-soft);
  border:1px solid #dce5eb;
  border-radius:8px;
}
.control label{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:3px;
  min-height:31px;
  font-size:14px;
  line-height:1.25;
  color:var(--muted);
  font-weight:400;
}
.value{
  color:var(--green-dark);
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
input[type=range]{
  display:block;width:100%;height:17px;margin-top:3px;
  accent-color:var(--green);
  cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:5px;border-radius:5px;background:#cbd7df;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:15px;height:15px;margin-top:-5px;border-radius:50%;
  background:var(--green);border:2px solid white;
  box-shadow:0 0 0 1px var(--green-dark);
}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:#cbd7df}
input[type=range]::-moz-range-thumb{
  width:12px;height:12px;border-radius:50%;
  background:var(--green);border:2px solid white;
  box-shadow:0 0 0 1px var(--green-dark);
}
.bottom-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.play-btn{
  border:0;border-radius:7px;padding:8px 18px;
  color:#073d32;background:var(--green);
  font-size:13px;font-weight:800;cursor:pointer;
  transition:filter .15s,transform .15s;
}
.play-btn:hover{filter:brightness(.96);transform:translateY(-1px)}
.play-btn.active{background:var(--orange);color:#4a260e}
.hint{font-size:12px;color:#718294}
@media(max-width:760px){
  body{padding:7px;gap:7px}
  main{gap:7px}
  .wave-card{padding:8px;gap:7px;grid-template-rows:auto minmax(120px,1fr) auto auto}
  .controls{gap:5px}
  .control{padding:6px}
  .control label{font-size:12px}
  .value{font-size:11px}
  .speed-row{gap:5px 9px}
  .speed-value{font-size:14px}
  .formula{font-size:10px}
  .canvas-caption{font-size:12px}
  .play-btn{padding:7px 12px}
}
@media(max-height:560px){
  body{padding:6px;gap:6px}
  header{min-height:38px}
  .wave-card{padding:8px;gap:6px;grid-template-rows:auto minmax(105px,1fr) auto auto}
  .control{padding:5px 7px}
  .control label{min-height:25px}
  .speed-row{min-height:34px;padding:4px}
}
</style>
</head>
<body>
<header><h1>Виды волн</h1></header>

<main>
  <section class="wave-card">
    <div class="card-heading">
      <h2>Поперечная волна</h2>

    </div>
    <div class="canvas-wrap">
      <canvas id="transverseCanvas" aria-label="Анимация поперечной волны"></canvas>
      <span class="canvas-caption">Частицы колеблются перпендикулярно направлению распространения волны (поперёк)</span>
    </div>
    <div class="speed-row">
      <span class="speed-value" id="transverseVelocity"><strong>v =</strong> <em>λ · ν</em> = <strong class="speed-result">1,50 м/с</strong></span>
    </div>
    <div>
      <div class="controls">
        <div class="control">
          <label for="transAmp">Амплитуда A <span class="value" id="transAmpVal">0,30 м</span></label>
          <input type="range" id="transAmp" min="0.10" max="0.80" step="0.05" value="0.30">
        </div>
        <div class="control">
          <label for="transFreq">Частота ν <span class="value" id="transFreqVal">1,0 Гц</span></label>
          <input type="range" id="transFreq" min="0.5" max="3" step="0.1" value="1">
        </div>
        <div class="control">
          <label for="transLambda">Длина волны λ <span class="value" id="transLambdaVal">1,50 м</span></label>
          <input type="range" id="transLambda" min="0.80" max="2.50" step="0.05" value="1.50">
        </div>
      </div>
      <div class="bottom-row" style="margin-top:8px">
        <button class="play-btn" id="transverseBtn" type="button">Старт</button>
        <span class="hint">Модель среды: частицы связаны между собой</span>
      </div>
    </div>
  </section>

  <section class="wave-card">
    <div class="card-heading">
      <h2>Продольная волна</h2>

    </div>
    <div class="canvas-wrap">
      <canvas id="longitudinalCanvas" aria-label="Анимация продольной волны"></canvas>
      <span class="canvas-caption">Частицы колеблются параллельно направлению распространения волны (вдоль)</span>
    </div>
    <div class="speed-row">
      <span class="speed-value" id="longitudinalVelocity"><strong>v =</strong> <em>λ · ν</em> = <strong class="speed-result">1,50 м/с</strong></span>
    </div>
    <div>
      <div class="controls">
        <div class="control">
          <label for="longAmp">Амплитуда A <span class="value" id="longAmpVal">0,15 м</span></label>
          <input type="range" id="longAmp" min="0.05" max="0.30" step="0.01" value="0.15">
        </div>
        <div class="control">
          <label for="longFreq">Частота ν <span class="value" id="longFreqVal">1,0 Гц</span></label>
          <input type="range" id="longFreq" min="0.5" max="3" step="0.1" value="1">
        </div>
        <div class="control">
          <label for="longLambda">Длина волны λ <span class="value" id="longLambdaVal">1,50 м</span></label>
          <input type="range" id="longLambda" min="0.80" max="2.50" step="0.05" value="1.50">
        </div>
      </div>
      <div class="bottom-row" style="margin-top:8px">
        <button class="play-btn" id="longitudinalBtn" type="button">Старт</button>
      </div>
    </div>
  </section>
</main>
<div class="signature">ЕВАлексеева</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const COLORS = {
    green: '#00CC97',
    greenDark: '#009e76',
    orange: '#FF8633',
    orangeDark: '#d96719',
    particle: '#243447',
    particleEdge: '#142333',
    grid: 'rgba(74, 100, 122, .15)'
  };

  const models = {
    transverse: {
      prefix: 'trans',
      canvas: $('transverseCanvas'),
      button: $('transverseBtn'),
      velocity: $('transverseVelocity'),
      time: 0,
      running: false,
      raf: 0,
      lastFrame: 0,
      type: 'transverse'
    },
    longitudinal: {
      prefix: 'long',
      canvas: $('longitudinalCanvas'),
      button: $('longitudinalBtn'),
      velocity: $('longitudinalVelocity'),
      time: 0,
      running: false,
      raf: 0,
      lastFrame: 0,
      type: 'longitudinal'
    }
  };

  const fmt = (n, digits = 2) => n.toFixed(digits).replace('.', ',');
  const params = model => {
    const p = model.prefix;
    return {
      amplitude: Number($(p + 'Amp').value),
      frequency: Number($(p + 'Freq').value),
      wavelength: Number($(p + 'Lambda').value)
    };
  };

  function updateReadouts(model) {
    const p = params(model);
    const prefix = model.prefix;
    $(prefix + 'AmpVal').textContent = fmt(p.amplitude) + ' м';
    $(prefix + 'FreqVal').textContent = fmt(p.frequency, 1) + ' Гц';
    $(prefix + 'LambdaVal').textContent = fmt(p.wavelength) + ' м';
    model.velocity.innerHTML = '<strong>v =</strong> <em>λ · ν</em> = <strong class="speed-result">' + fmt(p.wavelength * p.frequency) + ' м/с</strong>';
    if (!model.running) draw(model);
  }

  function setupCanvas(canvas) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const w = Math.round(rect.width * dpr);
    const h = Math.round(rect.height * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return {ctx, width: rect.width, height: rect.height};
  }

  function drawGrid(ctx, w, h, centerY) {
    ctx.save();
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 6]);
    ctx.beginPath();
    ctx.moveTo(0, centerY);
    ctx.lineTo(w, centerY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawParticle(ctx, x, y, radius, highlighted = false) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, radius + (highlighted ? 1.5 : 0), 0, Math.PI * 2);
    ctx.fillStyle = highlighted ? COLORS.orange : COLORS.particle;
    ctx.fill();
    ctx.lineWidth = highlighted ? 2.4 : 1.7;
    ctx.strokeStyle = highlighted ? COLORS.orangeDark : COLORS.particleEdge;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x - radius * .28, y - radius * .3, Math.max(1.2, radius * .22), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.72)';
    ctx.fill();
    ctx.restore();
  }

  function drawTransverse(ctx, w, h, p, time) {
    const centerY = h * .46;
    const visibleLength = 6.0; // Условная длина изображённого участка среды, м
    const pxPerMeterY = Math.min(62, h * .23 / .60);
    const k = 2 * Math.PI / p.wavelength;
    const omega = 2 * Math.PI * p.frequency;
    const phase = x => k * x - omega * time;
    const yAt = x => centerY + p.amplitude * pxPerMeterY * Math.sin(phase(x));

    drawGrid(ctx, w, h, centerY);

    // Линия среды
    ctx.beginPath();
    ctx.strokeStyle = '#50677a';
    ctx.lineWidth = 2.6;
    ctx.lineJoin = 'round';
    const samples = Math.max(220, Math.floor(w));
    for (let i = 0; i <= samples; i++) {
      const x = w * i / samples;
      const xm = visibleLength * x / w;
      const y = yAt(xm);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Частицы расположены на фиксированных координатах x
    const count = 35;
    const highlight = Math.floor(count * .34);
    for (let i = 0; i < count; i++) {
      const x = 10 + (w - 20) * i / (count - 1);
      const xm = visibleLength * x / w;
      drawParticle(ctx, x, yAt(xm), i === highlight ? 6.3 : 4.7, i === highlight);
    }

  }

  function drawLongitudinal(ctx, w, h, p, time) {
    const centerY = h * .46;
    const visibleLength = 6.0;
    const displacementScale = Math.min(75, w * .035);
    const k = 2 * Math.PI / p.wavelength;
    const omega = 2 * Math.PI * p.frequency;
    const count = 45;
    const baseStep = (w - 28) / (count - 1);
    const phaseAt = xm => k * xm - omega * time;
    const displacement = xm => p.amplitude * displacementScale * Math.sin(phaseAt(xm));

    drawGrid(ctx, w, h, centerY);

    // Подсветка сгущений и разрежений по фактическому расстоянию между частицами
    const positions = [];
    for (let i = 0; i < count; i++) {
      const baseX = 14 + i * baseStep;
      const xm = visibleLength * (baseX - 14) / (w - 28);
      positions.push(baseX + displacement(xm));
    }

    for (let i = 0; i < count - 1; i++) {
      const left = positions[i];
      const right = positions[i + 1];
      const spacing = right - left;
      const ratio = spacing / baseStep;
      if (ratio < .88) {
        ctx.fillStyle = 'rgba(0,204,151,.16)';
      } else if (ratio > 1.12) {
        ctx.fillStyle = 'rgba(255,134,51,.13)';
      } else {
        continue;
      }
      ctx.fillRect(left, centerY - 28, Math.max(0, spacing), 56);
    }

    // Тонкая направляющая
    ctx.beginPath();
    ctx.strokeStyle = '#9aabba';
    ctx.lineWidth = 1.5;
    ctx.moveTo(8, centerY);
    ctx.lineTo(w - 8, centerY);
    ctx.stroke();

    const highlight = Math.floor(count * .34);
    for (let i = 0; i < count; i++) {
      const baseX = 14 + i * baseStep;
      const xm = visibleLength * (baseX - 14) / (w - 28);
      drawParticle(ctx, positions[i], centerY, i === highlight ? 6.7 : 5.1, i === highlight);
    }
  }

  function draw(model) {
    const surface = setupCanvas(model.canvas);
    if (!surface) return;
    const {ctx, width, height} = surface;
    ctx.clearRect(0, 0, width, height);
    const p = params(model);
    if (model.type === 'transverse') drawTransverse(ctx, width, height, p, model.time);
    else drawLongitudinal(ctx, width, height, p, model.time);
  }

  function animate(model, timestamp) {
    if (!model.running) return;
    if (!model.lastFrame) model.lastFrame = timestamp;
    const delta = Math.min((timestamp - model.lastFrame) / 1000, .05);
    model.lastFrame = timestamp;
    model.time += delta;
    draw(model);
    model.raf = requestAnimationFrame(t => animate(model, t));
  }

  function toggle(model) {
    model.running = !model.running;
    model.button.textContent = model.running ? 'Стоп' : 'Старт';
    model.button.classList.toggle('active', model.running);
    if (model.running) {
      model.lastFrame = 0;
      model.raf = requestAnimationFrame(t => animate(model, t));
    } else {
      cancelAnimationFrame(model.raf);
      draw(model);
    }
  }

  Object.values(models).forEach(model => {
    model.button.addEventListener('click', () => toggle(model));
    ['Amp', 'Freq', 'Lambda'].forEach(suffix => {
      $(model.prefix + suffix).addEventListener('input', () => updateReadouts(model));
    });
    updateReadouts(model);
  });

  const resizeObserver = new ResizeObserver(() => {
    Object.values(models).forEach(draw);
  });
  Object.values(models).forEach(model => resizeObserver.observe(model.canvas));

  window.addEventListener('beforeunload', () => {
    Object.values(models).forEach(model => cancelAnimationFrame(model.raf));
  });
})();
</script>
</body>
</html>
